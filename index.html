<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <script src="particle.js"></script>
    <script src="sand.js"></script>
    <script src="water.js"></script>
    <script src="brick.js"></script>
  </head>

  <body>
    <!-- Layout: left panel | canvas | right panel -->
    <div id="app">
      <div id="left-panel" class="panel">
        <!-- Brush size buttons; data-brush is the brush size -->
        <button class="brush-button" data-brush="1">B1</button>
        <button class="brush-button" data-brush="2">B2</button>
      </div>
      <div id="canvas-holder"></div>
      <div id="right-panel" class="panel">
        <!-- Material buttons; data-type is the particle type -->
        <div id="material-list">
          <button class="material-button" data-type="eraser">Eraser</button>
          <button class="material-button" data-type="sand">Sand</button>
          <button class="material-button" data-type="water">Water</button>
          <button class="material-button" data-type="brick">Brick</button>
        </div>
      </div>
    </div>

    <script src="sketch.js"></script>
  </body>
</html>
